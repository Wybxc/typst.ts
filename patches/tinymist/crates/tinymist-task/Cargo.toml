[package]
name = "tinymist-task"
description = "Task model of typst for tinymist."
categories = ["compilers"]
keywords = ["language", "typst"]
# group: world
version = "0.14.6-rc3"
authors = ["The Typst Project Developers"]
license = "Apache-2.0"
edition = "2021"
homepage = "https://github.com/Myriad-Dreamin/tinymist"
repository = "https://github.com/Myriad-Dreamin/tinymist"
rust-version = "1.88.0"

[dependencies]
anyhow = "1"
clap = "4.5"
comemo = "0.5.0"
dirs = "6"
ecow = "0.2.6"
log = "0.4"
parking_lot = "0.12.1"
tokio = { version = "1.48.0", features = ["sync"] }
rayon = "1.11.0"
rpds = "1"
semver = "1"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
tinymist-world = "0.14.6-rc2"
tinymist-std = "0.14.6-rc2"
tinymist-derive = "0.14.6-rc2"
toml = "0.8"
typst = "0.14.2"
typst-assets = "0.14.2"
typst-eval = "0.14.2"
typst-html = "0.14.2"
typst-layout = "0.14.2"
typst-pdf = "0.14.2"
typst-render = "0.14.2"
typst-shim = "0.14.6-rc2"
typst-svg = "0.14.2"
notify = "6"

[features]

default = ["pdf", "text"]
no-content-hint = []

pdf = []
text = []

