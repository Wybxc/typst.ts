[package]
name = "tinymist-project"
description = "Project model of typst for tinymist."
categories = ["compilers"]
keywords = ["language", "typst"]
# group: world
version = "0.14.6-rc3"
authors = ["The Typst Project Developers"]
license = "Apache-2.0"
edition = "2021"
homepage = "https://github.com/Myriad-Dreamin/tinymist"
repository = "https://github.com/Myriad-Dreamin/tinymist"
rust-version = "1.88.0"

[dependencies]
anyhow = "1"
clap = "4.5"
comemo = "0.5.0"
dirs = "6"
ecow = "0.2.6"
log = "0.4"
parking_lot = "0.12.1"
tokio = { version = "1.48.0", features = ["sync"] }
rayon = "1.11.0"
rpds = "1"
semver = "1"
serde = "1"
serde_json = "1"
tinymist-task = "0.14.6-rc2"
tinymist-world = "0.14.6-rc2"
tinymist-std = { version = "0.14.6-rc2", features = ["typst"] }
tinymist-derive = "0.14.6-rc2"
tinymist-l10n = "0.14.6-rc2"
toml = { version = "0.8", optional = true }
typst = "0.14.2"
typst-assets = "0.14.2"
notify = { version = "6", optional = true }
js-sys = { version = "^0.3", optional = true }
wasm-bindgen = { version = "^0.2", optional = true }

[features]

fonts = ["typst-assets/fonts"]
no-content-hint = ["tinymist-task/no-content-hint"]
lsp = ["toml"]
# "system", 

system = ["tinymist-std/system", "tinymist-world/system", "toml", "notify"]
web = ["tinymist-std/web", "tinymist-world/web", "js-sys", "wasm-bindgen"]

