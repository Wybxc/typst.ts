[package]
name = "tinymist-package"
description = "Tinymist package support for Typst."
categories = ["compilers"]
keywords = ["api", "language", "typst"]
# group: world
version = "0.14.6-rc3"
authors = ["The Typst Project Developers"]
license = "Apache-2.0"
edition = "2021"
homepage = "https://github.com/Myriad-Dreamin/tinymist"
repository = "https://github.com/Myriad-Dreamin/tinymist"
rust-version = "1.88.0"

[dependencies]

base64 = "0.22"
comemo = "0.5.0"
ecow = "0.2.6"
flate2 = "1"
log = "0.4"
parking_lot = "0.12.1"
rayon = "1.11.0"
serde = "1"
serde_json = "1"
tar = "0.4"
typst = "0.14.2"
tinymist-std = "0.14.6-rc2"

toml = { version = "0.8", optional = true }
reqwest = { version = "0.12", features = ["blocking"], optional = true }
dirs = { version = "6", optional = true }
walkdir = { version = "2", optional = true }
fastrand = { version = "2.3.0", optional = true }

js-sys = { version = "^0.3", optional = true }
wasm-bindgen = { version = "^0.2", optional = true }
web-sys = { version = "^0.3", optional = true, features = ["console"] }

[dev-dependencies]
insta = "1.43"

[features]

default = []
fs-pack = ["walkdir"]
gitcl-pack = ["toml", "tinymist-std/system"]
http-pack = ["http-registry"]
release-pack = ["http-pack"]
universe-pack = ["http-pack"]
http-registry = ["reqwest", "dirs"]
web = ["wasm-bindgen", "web-sys", "js-sys", "tinymist-std/web"]
browser = ["web"]
system = [
    "http-registry",
    "fs-pack",
    "gitcl-pack",
    "http-pack",
    "release-pack",
    "universe-pack",
    "tinymist-std/system",
]


